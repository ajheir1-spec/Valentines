<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Favorite Person</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe6e6;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        h1 { color: #d63384; text-align: center; }
        .btn-wrap { position: relative; width: 100%; height: 200px; display: flex; justify-content: center; align-items: center; }
        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
        }
        #yes-btn { background-color: #ff4d6d; color: white; margin-right: 20px; z-index: 10; }
        #no-btn { 
            background-color: #A50044; /* Barça Red */
            color: white; 
            position: absolute; /* This allows it to jump! */
            transition: 0.1s;
            z-index: 5;
        }
    </style>
</head>
<body>

    <h1 id="question">Will you be my Valentine? ❤️</h1>
    
    <div class="btn-wrap">
        <button id="yes-btn" onclick="celebrate()">YES</button>
        <button id="no-btn">NO</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        const noBtn = document.getElementById('no-btn');
        const question = document.getElementById('question');

        const moveButton = () => {
            // This logic calculates a random spot on the screen
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        };

        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveButton(); });

        function celebrate() {
            question.innerHTML = "Yay! See you on the 14th! 🥰";
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 }
            });
            noBtn.style.display = 'none';
        }
    </script>
</body>
</html>
