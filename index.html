<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Favorite Person</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #ffe6e6;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            text-align: center;
        }
        .container {
            padding: 20px;
            z-index: 2;
        }
        img {
            width: 250px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { color: #d63384; margin-bottom: 30px; }
        .btn-container {
            position: relative;
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        button {
            padding: 15px 35px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }
        #yes-btn {
            background-color: #ff4d6d;
            color: white;
            margin-right: 120px;
        }
        #no-btn {
            background-color: #A50044;
            color: white;
            position: absolute;
            z-index: 999; /* Keeps it on top */
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="C1511496-5083-4C84-B60A-6894D92BD462_1_105_c.jpeg" alt="Us">
        
        <h1 id="question">Will you be my Valentine? ❤️</h1>
        
        <div class="btn-container">
            <button id="yes-btn" onclick="celebrate()">YES</button>
            <button id="no-btn">NO</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
   <script>
    const noBtn = document.getElementById('no-btn');
    const question = document.getElementById('question');
    const coupleImg = document.querySelector('img'); // This targets your photo

    const moveButton = () => {
        // Get the location of your photo on the screen
        const imgRect = coupleImg.getBoundingClientRect();
        const imgCenterX = imgRect.left + imgRect.width / 2;
        const imgCenterY = imgRect.top + imgRect.height / 2;

        // Set the "Dodge Radius" (2 inches is roughly 150-200 pixels)
        const radius = 180; 

        // Calculate a random position within that radius
        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * radius;

        const x = imgCenterX + distance * Math.cos(angle) - (noBtn.offsetWidth / 2);
        const y = imgCenterY + distance * Math.sin(angle) - (noBtn.offsetHeight / 2);

        // Apply the position
        noBtn.style.position = 'fixed';
        noBtn.style.left = `${x}px`;
        noBtn.style.top = `${y}px`;
    };

    noBtn.addEventListener('mouseover', moveButton);
    noBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        moveButton();
    });

    function celebrate() {
        question.innerHTML = "Yay! See you on the 14th! 🥰";
        confetti({
            particleCount: 150,
            spread: 70,
            origin: { y: 0.6 }
        });
        noBtn.style.display = 'none';
    }
</script>
</body>
</html>
