<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Favorite Person</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #ffe6e6;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            text-align: center;
        }
        img {
            width: 250px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        h1 { color: #A50044; margin-bottom: 30px; }
        .btn-container {
            position: relative;
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        button {
            padding: 15px 35px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
        }
        #yes-btn {
            background-color: #004D98; /* Barça Blue */
            color: white;
            margin-right: 120px;
            z-index: 10;
        }
        #no-btn {
            background-color: #A50044; /* Barça Red */
            color: white;
            position: fixed; 
            z-index: 999;
            left: 55%; /* Starting position */
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="C1511496-5083-4C84-B60A-6894D92BD462_1_105_c.jpeg" alt="Us" id="couple-img">
        <h1 id="question">Will you be my Valentine? ❤️</h1>
        <div class="btn-container">
            <button id="yes-btn" onclick="celebrate()">YES</button>
            <button id="no-btn">NO</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script>
        const noBtn = document.getElementById('no-btn');
        const question = document.getElementById('question');

        function moveButton() {
            // Dodge within a safe visible area
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 150);
            
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        // Add the listeners correctly
        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            moveButton();
        });

        function celebrate() {
            question.innerHTML = "Yay! See you on the 14th! 🥰";
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#A50044', '#004D98', '#EDBB00']
            });
            noBtn.style.display = 'none';
        }
    </script>
</body>
</html>
