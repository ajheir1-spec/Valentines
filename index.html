<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Favorite Person</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe6e6;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        h1 { color: #A50044; text-align: center; margin-bottom: 30px; }
        .buttons-container {
            position: relative;
            width: 100%;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        button {
            padding: 15px 35px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
        }
        #yes-btn {
            background-color: #004D98; /* Barça Blue */
            color: white;
            z-index: 10;
        }
        #no-btn {
            background-color: #A50044; /* Barça Red */
            color: white;
            position: absolute;
            transition: all 0.1s ease;
            z-index: 5;
        }
    </style>
</head>
<body>

    <h1 id="question">Will you be my Valentine? ❤️</h1>
    
    <div class="buttons-container">
        <button id="yes-btn" onclick="celebrate()">YES</button>
        <button id="no-btn">NO</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        const noBtn = document.getElementById('no-btn');
        const question = document.getElementById('question');
        const yesBtn = document.getElementById('yes-btn');

        const moveButton = () => {
            // This ensures the button stays within the viewable screen area
            const padding = 50;
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - padding);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - padding);
            
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        };

        // Makes it dodge
        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            moveButton();
        });

        function celebrate() {
            question.innerHTML = "Yay! See you on the 14th! 🥰";
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#A50044', '#004D98', '#EDBB00'] // Barça Colors!
            });
            noBtn.style.display = 'none';
        }
    </script>
</body>
</html>
